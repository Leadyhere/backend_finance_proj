services:
  api:
    build: .
    ports:
      - "5001:5001"
    environment:
      JWT_SECRET: local-development-secret-change-me
      DB_URI: mongodb://mongo:27017/finance_module
      PORT: 5001
      CLIENT_URL: http://localhost:5173
      DEMO_MODE: "true"
      MARKET_FEED_MODE: demo
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_MODEL: ${XAI_MODEL:-grok-4.6}
      XAI_REQUEST_TIMEOUT_MS: ${XAI_REQUEST_TIMEOUT_MS:-30000}
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - finance-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  finance-mongo-data:
